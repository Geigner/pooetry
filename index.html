<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מילים - Tנופת</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&family=Frank+Ruhl+Libre:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- פאביקון מעוצב כסמל נוצה יוקרתי -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23475d71'/><path d='M30 75 C 30 75, 35 45, 65 25 C 65 25, 70 50, 45 75 Z' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/><path d='M42 63 L 60 45' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/></svg>">

  <style>
    :root {
      --bg-base: #f7f4ef;
      --text-main: #222222;
      --text-muted: #666666;
      --primary: #475d71;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(230, 226, 221, 0.9);
      --accent-glow-1: rgba(215, 195, 170, 0.6);
      --accent-glow-2: rgba(180, 200, 220, 0.55);
      --accent-glow-3: rgba(230, 220, 200, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Assistant', sans-serif; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* --- רקע דינאמי חי (Blobs) --- */
    .ambient-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      animation: floatAnimation 14s infinite ease-in-out alternate;
    }

    .blob-1 { width: 550px; height: 550px; background: var(--accent-glow-1); top: -100px; right: -100px; }
    .blob-2 { width: 650px; height: 650px; background: var(--accent-glow-2); bottom: -150px; left: -100px; animation-delay: -7s; }
    .blob-3 { width: 400px; height: 400px; background: var(--accent-glow-3); top: 40%; left: 30%; animation-delay: -4s; }

    @keyframes floatAnimation {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.12); }
      100% { transform: translate(-40px, -50px) scale(0.92); }
    }

    /* --- חותמת מים דיסקרטית ושקטה בפינה --- */
    .subtle-watermark {
      position: fixed;
      bottom: 30px;
      left: 35px;
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
      opacity: 0.3;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 5;
      user-select: none;
    }

    /* --- כפתור תפריט דיסקרטי --- */
    .menu-toggle-btn {
      position: fixed;
      top: 25px; right: 25px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--card-border);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
      z-index: 99;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-toggle-btn:hover {
      background: var(--primary);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(71, 93, 113, 0.2);
    }

    /* --- מגירת צד נסתרת --- */
    .sidebar-drawer {
      position: fixed;
      top: 0; right: -380px;
      width: 350px; max-width: 90vw; height: 100vh;
      background: rgba(253, 253, 252, 0.92);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--card-border);
      box-shadow: -10px 0 40px rgba(0,0,0,0.08);
      z-index: 1001;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 40px 25px;
      display: flex; flex-direction: column; gap: 30px;
    }

    .sidebar-drawer.active { right: 0; }

    .sidebar-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--card-border); padding-bottom: 15px;
    }

    .sidebar-title { font-family: 'Frank Ruhl Libre', serif; font-size: 1.4rem; font-weight: 700; }

    .sidebar-close {
      background: rgba(0,0,0,0.05); border: none; width: 34px; height: 34px;
      border-radius: 50%; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background 0.2s;
    }
    .sidebar-close:hover { background: rgba(0,0,0,0.1); }

    .sidebar-section { display: flex; flex-direction: column; gap: 12px; }
    .sidebar-label { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }

    .search-input {
      background: rgba(255, 255, 255, 0.8); border: 1px solid var(--card-border);
      padding: 10px 16px; border-radius: 12px; font-size: 0.95rem; width: 100%;
      color: var(--text-main); outline: none; transition: all 0.3s;
    }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 4px 12px rgba(71, 93, 113, 0.1); }

    .filter-bar { display: flex; flex-direction: column; gap: 8px; }
    .filter-btn {
      background: rgba(255, 255, 255, 0.6); border: 1px solid var(--card-border);
      padding: 10px 16px; border-radius: 12px; font-size: 0.95rem; text-align: right;
      color: var(--text-main); cursor: pointer; transition: all 0.2s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--primary); color: #ffffff; border-color: var(--primary); padding-right: 20px;
    }

    .drawer-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 15, 15, 0.3); backdrop-filter: blur(4px);
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .drawer-overlay.active { opacity: 1; pointer-events: all; }

    .container { max-width: 950px; width: 100%; z-index: 1; }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 300;
    }

    /* --- רשת כרטיסים אקסקלוסיבית עם הברקת אור --- */
    .chocolate-box-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 22px;
    }

    .chocolat-piece {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      height: 170px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .chocolat-piece::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        135deg,
        transparent 45%,
        rgba(255, 255, 255, 0.7) 50%,
        transparent 55%
      );
      transform: translateY(-100%) translateX(-100%) rotate(25deg);
      animation: luxuryShimmer 9s infinite ease-in-out;
      pointer-events: none;
    }

    .chocolat-piece:nth-child(2n)::after { animation-delay: 3s; }
    .chocolat-piece:nth-child(3n)::after { animation-delay: 6s; }

    @keyframes luxuryShimmer {
      0% { transform: translateY(-100%) translateX(-100%) rotate(25deg); }
      25%, 100% { transform: translateY(100%) translateX(100%) rotate(25deg); }
    }

    .chocolat-piece:hover, .chocolat-piece.active-mobile {
      transform: translateY(-6px) scale(1.02);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 16px 40px rgba(71, 93, 113, 0.15);
      border-color: rgba(71, 93, 113, 0.4);
      height: 230px;
      z-index: 10;
    }

    .piece-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .piece-cat {
      font-size: 0.75rem;
      background: rgba(71, 93, 113, 0.08);
      color: var(--primary);
      padding: 3px 9px;
      border-radius: 10px;
      font-weight: 600;
    }

    .piece-title {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.35;
      margin-top: 10px;
    }

    .piece-peek {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 0.9rem;
      color: #444;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 8px;
    }

    .chocolat-piece:hover .piece-peek, .chocolat-piece.active-mobile .piece-peek {
      opacity: 1;
      transform: translateY(0);
    }

    .piece-hint {
      font-size: 0.78rem;
      color: var(--primary);
      font-weight: 600;
      opacity: 0;
      transform: translateY(5px);
      transition: all 0.3s ease;
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chocolat-piece:hover .piece-hint, .chocolat-piece.active-mobile .piece-hint {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- מודאל קריאה מלאה --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 15, 15, 0.45);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 20px;
    }

    .modal-overlay.active { opacity: 1; pointer-events: all; }

    .modal-content {
      background: #fdfdfc;
      border-radius: 24px;
      max-width: 680px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 45px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.2);
      position: relative;
      transform: translateY(20px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(255,255,255,0.6);
    }

    .modal-overlay.active .modal-content { transform: translateY(0); }

    .close-btn {
      position: absolute;
      top: 22px; left: 22px;
      background: rgba(0,0,0,0.05);
      border: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }
    .close-btn:hover { background: rgba(0,0,0,0.1); transform: rotate(90deg); }

    .modal-header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .font-sizer { display: flex; gap: 6px; background: rgba(0,0,0,0.05); padding: 4px; border-radius: 8px; }
    .font-btn {
      background: transparent; border: none; padding: 2px 8px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; color: var(--text-muted); border-radius: 6px; transition: all 0.2s;
    }
    .font-btn:hover { background: white; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

    .modal-cat {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
      display: inline-block;
      margin-bottom: 10px;
    }

    .modal-title {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 2.1rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #111;
    }

    .modal-body {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 1.25rem;
      line-height: 1.9;
      color: #2b2b2b;
      white-space: pre-wrap;
      transition: font-size 0.2s ease;
    }

    .loading { text-align: center; color: var(--text-muted); font-size: 1.1rem; margin-top: 60px; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <!-- רקע דינאמי חי -->
  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- חותמת מים דיסקרטית ושקטה בפינה -->
  <div class="subtle-watermark">Tנופת</div>

  <button class="menu-toggle-btn" id="menu-toggle-btn">
    <span>☰</span> חיפוש וסינון
  </button>

  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="sidebar-drawer" id="sidebar-drawer">
    <div class="sidebar-header">
      <h2 class="sidebar-title">ניווט וסינון</h2>
      <button class="sidebar-close" id="sidebar-close">&times;</button>
    </div>

    <div class="sidebar-section">
      <span class="sidebar-label">חיפוש חופשי</span>
      <input type="text" id="search-input" class="search-input" placeholder="הקלד לחיפוש ביצירות...">
    </div>

    <div class="sidebar-section">
      <span class="sidebar-label">קטגוריות</span>
      <nav class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-cat="all">הכל</button>
      </nav>
    </div>
  </aside>

  <div class="container">
    <header>
      <h1>מילים</h1>
      <p class="subtitle">מרחב יצירה מינימליסטי</p>
    </header>

    <main id="poetry-container" class="chocolate-box-grid">
      <div class="loading">טוען יצירות מהענן...</div>
    </main>
  </div>

  <!-- מודאל קריאה -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <button class="close-btn" id="close-modal">&times;</button>
      <div class="modal-header-actions">
        <span class="modal-cat" id="modal-cat"></span>
        <div class="font-sizer">
          <button class="font-btn" onclick="changeFontSize(1)" title="הגדל טקסט">A+</button>
          <button class="font-btn" onclick="changeFontSize(-1)" title="הקטן טקסט">A-</button>
        </div>
      </div>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAngVWlat_rJQO3lxU6QgiubCCg39EgTtU",
      authDomain: "notes-1ea7c.firebaseapp.com",
      projectId: "notes-1ea7c",
      storageBucket: "notes-1ea7c.firebasestorage.app",
      messagingSenderId: "708973221800",
      appId: "1:708973221800:web:d68ddcb51e69e8a450af9d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allPieces = [];
    let currentCategory = 'all';
    let currentSearchQuery = '';
    let currentModalFontSize = 1.25;

    async function loadLiteraryPieces() {
      const container = document.getElementById('poetry-container');
      try {
        const q = query(collection(db, "notes"), where("isPublic", "==", true));
        const querySnapshot = await getDocs(q);
        allPieces = [];

        querySnapshot.forEach((docSnap) => {
          const note = docSnap.data();
          if (!note.archived) {
            allPieces.push({ id: docSnap.id, ...note });
          }
        });

        allPieces.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        if (allPieces.length === 0) {
          container.innerHTML = `<div class="loading">עדיין אין יצירות להצגה.</div>`;
          return;
        }

        buildCategoryFilters();
        renderPieces();
        setupMenuAndSearch();
        setupGlobalKeyboardEvents();

      } catch (error) {
        console.error(error);
        container.innerHTML = `<div class="loading" style="color: #be123c;">שגיאה בטעינת הנתונים מהענן.</div>`;
      }
    }

    function setupMenuAndSearch() {
      const toggleBtn = document.getElementById('menu-toggle-btn');
      const drawer = document.getElementById('sidebar-drawer');
      const overlay = document.getElementById('drawer-overlay');
      const closeBtn = document.getElementById('sidebar-close');
      const searchInput = document.getElementById('search-input');

      function openDrawer() {
        drawer.classList.add('active');
        overlay.classList.add('active');
        searchInput.focus();
      }

      function closeDrawer() {
        drawer.classList.remove('active');
        overlay.classList.remove('active');
      }

      toggleBtn.addEventListener('click', openDrawer);
      closeBtn.addEventListener('click', closeDrawer);
      overlay.addEventListener('click', closeDrawer);

      searchInput.addEventListener('input', (e) => {
        currentSearchQuery = e.target.value.trim().toLowerCase();
        renderPieces();
      });

      window.closeDrawer = closeDrawer;
    }

    function setupGlobalKeyboardEvents() {
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (document.getElementById('sidebar-drawer').classList.contains('active')) {
            window.closeDrawer();
          }
          if (document.getElementById('modal-overlay').classList.contains('active')) {
            document.getElementById('modal-overlay').classList.remove('active');
          }
        }
      });
    }

    function buildCategoryFilters() {
      const filterBar = document.getElementById('filter-bar');
      const categories = new Set(allPieces.map(p => p.category || 'יצירה'));
      
      filterBar.innerHTML = `<button class="filter-btn active" data-cat="all">הכל</button>`;
      
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.cat = cat;
        btn.textContent = cat;
        filterBar.appendChild(btn);
      });

      filterBar.addEventListener('click', (e) => {
        if (e.target.classList.contains('filter-btn')) {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentCategory = e.target.dataset.cat;
          renderPieces();
        }
      });
    }

    function renderPieces() {
      const container = document.getElementById('poetry-container');
      
      let filtered = allPieces.filter(p => {
        const matchesCategory = (currentCategory === 'all' || (p.category || 'יצירה') === currentCategory);
        const title = (p.title || '').toLowerCase();
        const text = (p.text || '').toLowerCase();
        const matchesSearch = !currentSearchQuery || title.includes(currentSearchQuery) || text.includes(currentSearchQuery);
        
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="loading">לא נמצאו יצירות התואמות את החיפוש.</div>`;
        return;
      }

      let html = '';
      filtered.forEach(p => {
        const title = p.title || 'ללא כותרת';
        const cat = p.category || 'יצירה';
        
        html += `
          <div class="chocolat-piece" data-id="${p.id}" onclick="handlePieceClick(event, '${p.id}')">
            <div>
              <div class="piece-header">
                <span class="piece-cat">${escapeHtml(cat)}</span>
              </div>
              <h3 class="piece-title">${escapeHtml(title)}</h3>
            </div>
            <div class="piece-peek">${escapeHtml(p.text)}</div>
            <div class="piece-hint">לקריאה מלאה &larr;</div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    window.handlePieceClick = function(event, id) {
      const card = event.currentTarget;
      const isMobile = window.innerWidth <= 768;

      if (isMobile && !card.classList.contains('active-mobile')) {
        document.querySelectorAll('.chocolat-piece').forEach(c => c.classList.remove('active-mobile'));
        card.classList.add('active-mobile');
        event.stopPropagation();
      } else {
        openModal(id);
      }
    };

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.chocolat-piece')) {
        document.querySelectorAll('.chocolat-piece').forEach(c => c.classList.remove('active-mobile'));
      }
    });

    window.openModal = function(id) {
      const piece = allPieces.find(p => p.id === id);
      if (!piece) return;

      currentModalFontSize = 1.25;
      const bodyEl = document.getElementById('modal-body');
      bodyEl.style.fontSize = currentModalFontSize + 'rem';
      bodyEl.textContent = piece.text || '';

      document.getElementById('modal-title').textContent = piece.title || 'ללא כותרת';
      document.getElementById('modal-cat').textContent = piece.category || 'יצירה';
      document.getElementById('modal-overlay').classList.add('active');
    };

    window.changeFontSize = function(direction) {
      currentModalFontSize += direction * 0.12;
      if (currentModalFontSize < 0.95) currentModalFontSize = 0.95;
      if (currentModalFontSize > 2.0) currentModalFontSize = 2.0;
      document.getElementById('modal-body').style.fontSize = currentModalFontSize + 'rem';
    };

    document.getElementById('close-modal').addEventListener('click', () => {
      document.getElementById('modal-overlay').classList.remove('active');
    });

    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') {
        document.getElementById('modal-overlay').classList.remove('active');
      }
    });

    function escapeHtml(text) {
      return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    loadLiteraryPieces();
  </script>
