<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קופסת השוקולדים (נשימה צבעונית רכה) - Tנופת</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&family=Frank+Ruhl+Libre:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #f7f4ef;
      --text-main: #222222;
      --text-muted: #666666;
      --primary: #475d71;
      --accent-glow-1: rgba(215, 195, 170, 0.6);
      --accent-glow-2: rgba(180, 200, 220, 0.55);
      --accent-glow-3: rgba(230, 220, 200, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Assistant', sans-serif; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* --- רקע דינאמי חי (Blobs) --- */
    .ambient-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      animation: floatAnimation 14s infinite ease-in-out alternate;
    }

    .blob-1 { width: 550px; height: 550px; background: var(--accent-glow-1); top: -100px; right: -100px; }
    .blob-2 { width: 650px; height: 650px; background: var(--accent-glow-2); bottom: -150px; left: -100px; animation-delay: -7s; }
    .blob-3 { width: 400px; height: 400px; background: var(--accent-glow-3); top: 40%; left: 30%; animation-delay: -4s; }

    @keyframes floatAnimation {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.12); }
      100% { transform: translate(-40px, -50px) scale(0.92); }
    }

    .container { max-width: 950px; width: 100%; z-index: 1; }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 300;
    }

    /* --- רשת "קופסת השוקולדים" --- */
    .chocolate-box-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 22px;
    }

    .chocolat-piece {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(230, 226, 221, 0.85);
      border-radius: 18px;
      height: 170px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    /* שכבת צבע פנימית שנושמת וזזה בעדינות על פני כל הכרטיס */
    .chocolat-piece::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(215, 195, 170, 0.25), rgba(180, 200, 220, 0.25));
      opacity: 0;
      transition: opacity 0.8s ease;
      animation: cardBreath 7s infinite ease-in-out;
      z-index: 0;
      pointer-events: none;
    }

    /* פיזור זמני ההשהיה כדי שכל כרטיס ינשום בקצב משלו */
    .chocolat-piece:nth-child(2n)::before { animation-delay: 2s; }
    .chocolat-piece:nth-child(3n)::before { animation-delay: 4s; }
    .chocolat-piece:nth-child(5n)::before { animation-delay: 5.5s; }

    @keyframes cardBreath {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.02); }
    }

    /* דאגה שהתוכן בתוך הכרטיס יישאר מעל שכבת הצבע הנושמת */
    .chocolat-piece > * {
      position: relative;
      z-index: 1;
    }

    /* אנימציית ריחוף יוקרתית */
    .chocolat-piece:hover, .chocolat-piece.active-mobile {
      transform: translateY(-6px) scale(1.02);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 16px 40px rgba(71, 93, 113, 0.16);
      border-color: rgba(71, 93, 113, 0.4);
      height: 230px;
      z-index: 10;
    }

    .chocolat-piece:hover::before {
      opacity: 0.9; /* העצמת הצבע בעת ריחוף */
    }

    .piece-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .piece-cat {
      font-size: 0.75rem;
      background: rgba(71, 93, 113, 0.08);
      color: var(--primary);
      padding: 3px 9px;
      border-radius: 10px;
      font-weight: 600;
    }

    .piece-title {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.35;
      margin-top: 10px;
    }

    /* ההצצה שצפה ועולה בעדינות */
    .piece-peek {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 0.9rem;
      color: #444;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 8px;
    }

    .chocolat-piece:hover .piece-peek, .chocolat-piece.active-mobile .piece-peek {
      opacity: 1;
      transform: translateY(0);
    }

    /* רמז ויזואלי (חץ עדין שמופיע בריחוף) */
    .piece-hint {
      font-size: 0.78rem;
      color: var(--primary);
      font-weight: 600;
      opacity: 0;
      transform: translateY(5px);
      transition: all 0.3s ease;
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chocolat-piece:hover .piece-hint, .chocolat-piece.active-mobile .piece-hint {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- מודאל קריאה מלאה --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 15, 15, 0.45);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 20px;
    }

    .modal-overlay.active { opacity: 1; pointer-events: all; }

    .modal-content {
      background: #fdfdfc;
      border-radius: 24px;
      max-width: 680px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 45px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.2);
      position: relative;
      transform: translateY(20px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(255,255,255,0.6);
    }

    .modal-overlay.active .modal-content { transform: translateY(0); }

    .close-btn {
      position: absolute;
      top: 22px; left: 22px;
      background: rgba(0,0,0,0.05);
      border: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }
    .close-btn:hover { background: rgba(0,0,0,0.1); transform: rotate(90deg); }

    .modal-cat {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
      display: inline-block;
      margin-bottom: 10px;
    }

    .modal-title {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 2.1rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #111;
    }

    .modal-body {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 1.2rem;
      line-height: 1.9;
      color: #2b2b2b;
      white-space: pre-wrap;
    }

    .loading { text-align: center; color: var(--text-muted); font-size: 1.1rem; margin-top: 60px; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <!-- רקע דינאמי חי -->
  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    <header>
      <h1>מילים</h1>
      <p class="subtitle">Tנופת - מרחב יצירה מינימליסטי</p>
    </header>

    <main id="poetry-container" class="chocolate-box-grid">
      <div class="loading">טוען קוביות מהענן...</div>
    </main>
  </div>

  <!-- מודאל קריאה -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <button class="close-btn" id="close-modal">&times;</button>
      <span class="modal-cat" id="modal-cat"></span>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAngVWlat_rJQO3lxU6QgiubCCg39EgTtU",
      authDomain: "notes-1ea7c.firebaseapp.com",
      projectId: "notes-1ea7c",
      storageBucket: "notes-1ea7c.firebasestorage.app",
      messagingSenderId: "708973221800",
      appId: "1:708973221800:web:d68ddcb51e69e8a450af9d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allPieces = [];

    async function loadBoxPieces() {
      const container = document.getElementById('poetry-container');
      try {
        const q = query(collection(db, "notes"), where("isPublic", "==", true));
        const querySnapshot = await getDocs(q);
        allPieces = [];

        querySnapshot.forEach((docSnap) => {
          const note = docSnap.data();
          if (!note.archived) {
            allPieces.push({ id: docSnap.id, ...note });
          }
        });

        allPieces.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        if (allPieces.length === 0) {
          container.innerHTML = `<div class="loading">עדיין אין יצירות להצגה.</div>`;
          return;
        }

        let html = '';
        allPieces.forEach(p => {
          const title = p.title || 'ללא כותרת';
          const cat = p.category || 'יצירה';
          
          html += `
            <div class="chocolat-piece" data-id="${p.id}" onclick="handlePieceClick(event, '${p.id}')">
              <div>
                <div class="piece-header">
                  <span class="piece-cat">${escapeHtml(cat)}</span>
                </div>
                <h3 class="piece-title">${escapeHtml(title)}</h3>
              </div>
              <div class="piece-peek">${escapeHtml(p.text)}</div>
              <div class="piece-hint">לקריאה מלאה &larr;</div>
            </div>
          `;
        });
        container.innerHTML = html;

      } catch (error) {
        console.error(error);
        container.innerHTML = `<div class="loading" style="color: #be123c;">שגיאה בטעינת הנתונים.</div>`;
      }
    }

    window.handlePieceClick = function(event, id) {
      const card = event.currentTarget;
      const isMobile = window.innerWidth <= 768;

      if (isMobile && !card.classList.contains('active-mobile')) {
        document.querySelectorAll('.chocolat-piece').forEach(c => c.classList.remove('active-mobile'));
        card.classList.add('active-mobile');
        event.stopPropagation();
      } else {
        openModal(id);
      }
    };

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.chocolat-piece')) {
        document.querySelectorAll('.chocolat-piece').forEach(c => c.classList.remove('active-mobile'));
      }
    });

    function openModal(id) {
      const piece = allPieces.find(p => p.id === id);
      if (!piece) return;

      document.getElementById('modal-title').textContent = piece.title || 'ללא כותרת';
      document.getElementById('modal-cat').textContent = piece.category || 'יצירה';
      document.getElementById('modal-body').textContent = piece.text || '';
      document.getElementById('modal-overlay').classList.add('active');
    }

    document.getElementById('close-modal').addEventListener('click', () => {
      document.getElementById('modal-overlay').classList.remove('active');
    });

    document.getElementById('modal-overlay').classList.addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') {
        document.getElementById('modal-overlay').classList.remove('active');
      }
    });

    function escapeHtml(text) {
      return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    loadBoxPieces();
  </script>
</body>
</html>
